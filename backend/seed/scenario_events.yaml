# Scripted background events (PRD v3 §13, A39), applied through the same services as real actions when the scenario
# clock reaches them. The README says they are simulated. The judge's own actions (release at 23:40, the VEH003 swap,
# the store-request deferral) are API calls, never events.
#
# Each event: {at: "2026-09-29T03:10:00+05:30", kind: <kind>, payload: {...}}
#
# Kinds handled today (backend/app/jobs.py):
#   evening_adjustments   Kumari's adjustments after the capacity review, saved as the next draft (v2).
#                         payload.moves: [{orderId, to: {vehicleId, trip} | "deferred"}]. A refused move is skipped and
#                         logged. Empty here: the planner's own draft is already the plan Kumari signs off (DP-24).
#   vehicle_available     A vehicle back from the workshop. payload.vehicle: VEH036 at 02:45 (A12).
# Kinds for the loader, driver and sync owners (load confirmations, departures, the 06:40 sync) are added with them.
events:
  - {at: "2026-09-28T21:15:00+05:30", kind: evening_adjustments, payload: {moves: []}}
  - {at: "2026-09-29T02:45:00+05:30", kind: vehicle_available, payload: {vehicle: VEH036}}
