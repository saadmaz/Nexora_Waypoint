server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sent on every response, including the ones from the location blocks below: add_header inherits
    # only when the inner block sets no header of its own, so the /assets/ and /index.html blocks
    # below repeat the set. No CSP yet: it needs testing against the Vite bundle and the service
    # worker, and a wrong one breaks the app silently. HSTS belongs with TLS, which terminates on
    # the host, so it is set there and not here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The API (and its Swagger UI at /api/docs) lives in the api service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POD photos and signatures are uploaded through here.
        client_max_body_size 20m;
    }

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the app shell must always be revalidated.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }

    # One SPA with four role areas (/dispatcher, /store, /loader, /driver): every other path is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
