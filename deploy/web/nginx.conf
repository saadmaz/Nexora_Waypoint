server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API (and its Swagger UI at /api/docs) lives in the api service.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POD photos and signatures are uploaded through here.
        client_max_body_size 20m;
    }

    # Hashed build assets never change, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the app shell must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # One SPA with four role areas (/dispatcher, /store, /loader, /driver): every other path is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
