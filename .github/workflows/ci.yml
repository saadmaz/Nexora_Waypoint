name: CI

# Contributing §17: the same commands you run before opening a PR. A failure blocks the merge.
on:
  push:
    branches: [feature/postgres18-v3-schema-alignment]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: waypoint
          POSTGRES_PASSWORD: waypoint
          POSTGRES_DB: waypoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waypoint -d waypoint_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # The API tests truncate and reseed this database: it is disposable.
      TEST_DATABASE_URL: postgresql+psycopg://waypoint:waypoint@localhost:5432/waypoint_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy waypoint_rules
      - name: PostgreSQL 18.6, fresh migration chain and seed
        env:
          DATABASE_URL: postgresql+psycopg://waypoint:waypoint@localhost:5432/waypoint_seed
          DEMO_PASSWORD: waypoint
          SEED_ON_START: "true"
          DATA_DIR: /tmp/waypoint-no-competition-data
        run: |
          test "$(PGPASSWORD=waypoint psql -h localhost -U waypoint -d waypoint_test -Atc 'SHOW server_version_num')" = "180006"
          PGPASSWORD=waypoint psql -h localhost -U waypoint -d waypoint_test -c "CREATE DATABASE waypoint_seed"
          alembic upgrade 0001
          alembic upgrade 0002
          # then every later migration, so the database is at head before the drift check
          alembic upgrade head
          alembic check
          python -m seed.run
      - run: pytest
      - name: alembic heads must print exactly one head
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          test "$(echo "$heads" | grep -c '(head)')" -eq 1

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: docker compose config --quiet
      - name: Fresh isolated Compose installation
        env:
          COMPOSE_PROJECT_NAME: waypoint-schema-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker compose up --build --wait --wait-timeout 240
          test "$(docker compose exec -T db psql -U waypoint -d waypoint -Atc 'SHOW server_version_num')" = "180006"
          docker compose exec -T api alembic current
          docker compose exec -T api python -m seed.run
          curl --fail http://localhost:8000/api/v1/health
          curl --fail http://localhost:8080/api/v1/health
          curl --fail http://localhost:8080/ | grep '<div id="root">'
      - name: Startup logs
        if: always()
        run: docker compose -p waypoint-schema-${{ github.run_id }}-${{ github.run_attempt }} logs --no-color
      - name: Remove only this job's disposable project
        if: always()
        run: docker compose -p waypoint-schema-${{ github.run_id }}-${{ github.run_attempt }} down --volumes
